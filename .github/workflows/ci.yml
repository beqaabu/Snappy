name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Ad-hoc signed: a build check doesn't need the release certificate (and PRs from forks can't read secrets).
      - name: Build universal app
        run: ADHOC=1 ./build.sh

      - name: Check architectures and deployment target
        run: |
          lipo -info build/Snappy.app/Contents/MacOS/Snappy
          vtool -show-build build/Snappy.app/Contents/MacOS/Snappy | grep minos
